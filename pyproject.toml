[project]
name = "code_index"
version = "0.3.0"
description = "Universal codebase index and hybrid semantic/lexical search for documentation generation"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "serge" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "numpy>=1.26",
    "pydantic>=2",
    "packaging>=23",
    "pathspec>=0.12",
]

[project.optional-dependencies]
# The fastembed backend ships as one of two mutually-exclusive extras:
# `cpu` (fastembed + onnxruntime CPU) or `gpu` (fastembed-gpu +
# onnxruntime-gpu + the nvidia CUDA/cuDNN/cuBLAS wheels). They share the
# `fastembed` import namespace and pull conflicting onnxruntime builds, so
# exactly one must be installed — enforced by [tool.uv].conflicts below.
# A bare install (no extra) has no embedding backend by design; pick one.
cpu = ["fastembed>=0.4"]
gpu = [
    "fastembed-gpu>=0.4",
    # onnxruntime-gpu (pulled by fastembed-gpu) does not declare its CUDA
    # runtime deps, so name the full CUDA-12 wheel set here. Without the
    # complete set, onnxruntime.preload_dlls() logs missing-DLL warnings
    # (e.g. cufft64_11.dll, cudart64_12.dll) even though the CUDA EP loads.
    "nvidia-cudnn-cu12>=9",
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
]
voyage = ["voyageai>=0.2"]
dev = ["fastembed>=0.4", "pytest>=8", "ruff>=0.6", "pyright>=1.1.350", "syrupy>=4"]

[tool.uv]
# `cpu` and `gpu` install incompatible fastembed/onnxruntime distributions
# into the same import namespace; never resolve them together.
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[project.scripts]
code_index = "code_index.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_index"]

[tool.hatch.build.targets.wheel.force-include]
"src/code_index/usage" = "code_index/usage"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src/code_index", "tests"]
exclude = ["tests/fixtures"]
strict = ["src/code_index"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = ["src"]
reportMissingImports = "warning"
