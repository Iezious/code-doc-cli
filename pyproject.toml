[project]
name = "code_index"
version = "0.1.0"
description = "Universal codebase index and hybrid semantic/lexical search for documentation generation"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "serge" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "numpy>=1.26",
    "pydantic>=2",
    "packaging>=23",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.2"]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.350"]

[project.scripts]
code_index = "code_index.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_index"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src/code_index", "tests"]
strict = ["src/code_index"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = ["src"]
reportMissingImports = "warning"
